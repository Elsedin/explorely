<section>
  <h1>Destinations</h1>

  @if (destinations().length === 0) {
    <p>No destinations found.</p>
  } @else {
    <div class="grid">
      @for (destination of destinations(); track destination.id) {
        <app-destination-card [destination]="destination" />
      }
    </div>
  }
</section>
